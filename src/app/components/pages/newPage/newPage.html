<div class="flex flex-col gap-5">
    <h1>Вторая страница</h1>
    <div class="flex gap-2 items-center">
        <span>Выбрано пунктов: {{ checkedItems().length }}</span>
        <span>Общее значение: {{ sumCheckedItems() }}</span>
    </div>
    <div class="flex flex-col gap-5">
        @for (item of list(); track item.key) {
            <div class="flex flex-col p-10 bg-white/60 text-black rounded-s">
                <label [for]="`checkbox-${item.key}`" class="flex items-baseline gap-2">
                    <input type="checkbox" [checked]="item.checked" [id]="`checkbox-${item.key}`" (change)="onChecked(item.key)" />
                    <div class="flex flex-col gap-2">
                        <h6>{{ item.title }}</h6>
                        <span>Value: {{ item.value }}</span>
                    </div>
                </label>
            </div>
        }
    </div>
</div>
