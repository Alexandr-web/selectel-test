<aside class="h-full border-r-1 p-5 border-solid border-white">
    <ul class="flex flex-col gap-2">
        @for (item of list; track item.link) {
            <li>
                <a class="text-white" [routerLink]="item.link" routerLinkActive="outline" [routerLinkActiveOptions]="{ exact: true }">{{ item.text }}</a>
            </li>
        }
    </ul>
</aside>
